{% if messages %}
<div class="mensagens">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
    {% if message.tags == 'success' %}<i class="fa-solid fa-circle-check me-2"></i>
    {% elif message.tags == 'danger' %}<i class="fa-solid fa-circle-exclamation me-2"></i>
    {% elif message.tags == 'warning' %}<i class="fa-solid fa-triangle-exclamation me-2"></i>
    {% else %}<i class="fa-solid fa-circle-info me-2"></i>{% endif %}
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
